name = "npa"
command = "python main.py"

[targets.default]
url = "s3://${FDL_S3_BUCKET}"
public_url = "https://data.queria.io"
s3_endpoint = "${FDL_S3_ENDPOINT}"
s3_access_key_id = "${FDL_S3_ACCESS_KEY_ID}"
s3_secret_access_key = "${FDL_S3_SECRET_ACCESS_KEY}"

[targets.local]
url = "~/.local/share/fdl"
public_url = "http://localhost:4001"

[meta]
license = "公共データ利用規約（第1.0版）"
license_url = "https://www.npa.go.jp/rules/index.html"
title = "警察庁 交通事故統計"
description = """警察庁が公開する交通事故統計情報のオープンデータ。
死傷者を伴う交通事故を1件1レコードで収録し、発生日時・地点（緯度経度）・
事故内容・天候・道路形状・事故類型などを持つ。"""
cover = "🚨"
tags = ['警察庁', '交通事故', '交通安全', 'GIS', '緯度経度']
source_url = "https://www.npa.go.jp/publications/statistics/koutsuu/opendata/index_opendata.html"
repository_url = "https://github.com/queria-io/dataset-npa"
schedule = "yearly"

[meta.schemas]
main.title = "メイン"
