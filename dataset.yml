spec_version: "0.1"
name: npa
title: 警察庁・都道府県警察 犯罪・交通事故統計
description: |-
  警察庁と都道府県警察が公開する犯罪・交通事故のオープンデータ。
  交通事故統計情報（発生日時・地点の緯度経度・事故内容・天候・事故類型など）と、
  犯罪発生情報（街頭犯罪7手口の町丁目単位・1認知件1レコード）と、
  犯罪統計資料（全都道府県の罪種別の認知件数・検挙件数・検挙人員）を収録する。
keywords:
  - 警察庁
  - 都道府県警察
  - 交通事故
  - 犯罪
  - 犯罪統計
  - 認知件数
  - 検挙率
  - 防犯
  - GIS
  - 緯度経度
  - 町丁目
homepage: https://github.com/queria-io/dataset-npa
language: ja

licenses:
