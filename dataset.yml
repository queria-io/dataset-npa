  - title: 犯罪オープンデータ リンク集（警察庁）
    path: https://www.npa.go.jp/toukei/seianki/hanzaiopendatalink.html
  - title: 犯罪統計（警察庁）
    path: https://www.npa.go.jp/publications/statistics/sousa/statistics.html

