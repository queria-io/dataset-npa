name: npa
title: 警察庁・都道府県警察 犯罪・交通事故統計
description: |-
  警察庁・警視庁・都道府県警察が公開する交通事故と犯罪のオープンデータです。交通事故は 1 件ごとの地点、犯罪は町丁目単位の発生情報と都道府県別・全国の統計を持ちます。
  出典は警察庁の交通事故統計情報・犯罪統計・特殊詐欺の統計、警視庁の町丁別認知件数、13 府県警の犯罪発生情報です。
