name: Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  schedule:
    - cron: "0 19 20 4 *" # 毎年4月21日 04:00 JST（前年確定データの公開後）
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@main
    with:
      dataset_name: npa
      s3_bucket: ${{ vars.S3_BUCKET }}
    secrets: inherit
