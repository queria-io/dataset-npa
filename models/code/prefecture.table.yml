schema: code
name: prefecture
title: 交通事故統計の都道府県コード
description: |-
  交通事故統計の都道府県コード（警察の管轄区分）と、JIS X 0401 の都道府県コードの対応表です。main.traffic_accident の lg_code はこの対応で作っています。

  - 北海道は方面別に 5 つのコード（10〜14）があり、JIS コードはどれも 01 です
  - 交通事故統計の市区町村コード（3 桁）は標準地域コードの市区町村の部分なので、JIS の都道府県コードと連結すると 5 桁の市区町村コードになります
keywords:
  - 警察庁
  - 交通事故
  - 都道府県コード
  - コード表
sources:
