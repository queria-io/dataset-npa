version: 2

models:
  - name: raw_theft
    description: |
      都道府県警察 犯罪発生情報の生データ。警察庁標準様式（手口別の可変列）を
      全手口の和集合スキーマへ統合済み。手口に存在しない列は NULL。
    columns:
      - name: crime_name
        description: 罪名（窃盗）
      - name: modus
        description: 手口（ひったくり・車上ねらい・部品ねらい・自動販売機ねらい・自動車盗・オートバイ盗・自転車盗）
      - name: police_station
        description: 管轄警察署（発生地）
      - name: police_box
        description: 管轄交番・駐在所（発生地）
      - name: city_code
        description: 市区町村コード（発生地）。県により先頭ゼロが欠落した5桁表記が混在
      - name: prefecture
        description: 都道府県（発生地）。発生地不明の場合は空
      - name: city
        description: 市区町村（発生地）
      - name: town
        description: 町丁目（発生地）
      - name: occurred_date_raw
        description: 発生年月日（始期）。YYYYMMDD 形式または「不明」
      - name: occurred_hour_raw
        description: 発生時（始期）。0〜23 または「不明」
      - name: location
        description: 発生場所（道路上・駐車（輪）場・一戸建住宅等）
      - name: location_detail
        description: 発生場所の詳細（ひったくりには存在しない）
      - name: victim_gender
        description: 被害者の性別（ひったくりのみ）
      - name: victim_age
        description: 被害者の年齢（ひったくり・自転車盗のみ）
      - name: victim_occupation
        description: 被害者の職業（自転車盗のみ）
      - name: cash_damage
        description: 現金被害の有無（ひったくり・車上ねらい・自動販売機ねらいのみ）
      - name: lock_status
        description: 施錠関係（車上ねらい・自動車盗・オートバイ盗・自転車盗のみ）
      - name: anti_theft_device
        description: 盗難防止装置の有無（自動車盗・オートバイ盗のみ）
      - name: stolen_property
        description: 現金以外の主な被害品（部品ねらい・自動車盗・オートバイ盗のみ）
      - name: source_prefecture
        description: データ公表元の都道府県警察（発生地の都道府県とは別に常に値を持つ）
      - name: data_year
        description: 公開データの対象年（西暦）

  - name: raw_crime_stats
    description: |
      警察庁 犯罪統計資料（1～12月分の確定値）の都道府県別表の生データ。
      第3表・第4表・第6表・第9表の当年の列を罪種×地域の縦持ちにしたもの。
      地域は原表の2列のままで、全国・地方計・北海道の方面別の行を含む。
    columns:
      - name: year
        description: 対象年（西暦。1～12月の確定値）
      - name: crime_type
        description: 罪種。原表のシートに対応し、公表どおりの名前で持つ
      - name: area_group
        description: 原表の1列目（地方名。全国の行は「全国」、東京都は単独で「東京都」）
      - name: area
        description: 原表の2列目（都道府県名・「計」・北海道の方面名。全国の行は「総数」）
      - name: recognized_cases
        description: 認知件数
      - name: cleared_cases
        description: 検挙件数
      - name: arrested_persons
        description: 検挙人員

  - name: raw_fraud_stats
    description: |
      警察庁「特殊詐欺の認知・検挙状況等について」の手口別・月別表の生データ。
      年別の確定値（2020〜2025年・令和2年の区分）と最新の暫定値（当年と前年・令和8年の区分）を
      区分×年×月×手口で1行にしたもの。形態（文言）別の内訳表と関連法令の表は含まない。
    columns:
      - name: classification_year
        description: 手口の区分の適用開始年（2020 または 2026）
      - name: year
        description: 対象年（西暦）
      - name: month
        description: 対象月（1〜12）
      - name: modus
        description: 手口。「特殊詐欺」は全手口の合計
      - name: is_provisional
        description: 暫定値か
      - name: recognized_cases
        description: 認知件数
      - name: completed_cases
        description: 認知件数のうち既遂
      - name: damage_amount_yen
        description: 実質的な被害総額（円）
      - name: completed_damage_amount_yen
        description: 被害総額（既遂のみ・円）
      - name: cleared_cases
        description: 検挙件数
      - name: arrested_persons
        description: 検挙人員

  - name: raw_town_crime
    description: |
      警視庁 区市町村の町丁別、罪種別及び手口別認知件数（年累計）の生データ。
      2009〜2016年の Excel（区市町村ごとのシート）と2017年以降の CSV から町丁字の行を取り出したもの。
      区市町村計・地域計・合計と、他県・海外認知・不明の行は含まない。
    columns:
      - name: year
        description: 対象年（西暦。1〜12月の年累計）
      - name: city_code
        description: 全国地方公共団体コード6桁
      - name: municipality
        description: 区市町村名（郡名・島名を外した正式名）
      - name: town
        description: 区市町村名を除いた町丁字名。区市町村名だけの行は NULL
      - name: total
        description: 総合計
      - name: heinous_total
        description: 凶悪犯計
      - name: heinous_robbery
        description: 凶悪犯強盗
      - name: heinous_other
        description: 凶悪犯その他
      - name: violent_total
        description: 粗暴犯計
      - name: violent_unlawful_assembly
        description: 粗暴犯凶器準備集合
      - name: violent_assault
        description: 粗暴犯暴行
      - name: violent_injury
        description: 粗暴犯傷害
      - name: violent_intimidation
        description: 粗暴犯脅迫
      - name: violent_extortion
        description: 粗暴犯恐喝
      - name: burglary_total
        description: 侵入窃盗計
      - name: burglary_safe
        description: 侵入窃盗金庫破り
      - name: burglary_school
        description: 侵入窃盗学校荒し
      - name: burglary_office
        description: 侵入窃盗事務所荒し
      - name: burglary_shop
        description: 侵入窃盗出店荒し
      - name: burglary_vacant_house
        description: 侵入窃盗空き巣
      - name: burglary_night
        description: 侵入窃盗忍込み
      - name: burglary_occupied_house
        description: 侵入窃盗居空き
      - name: burglary_other
        description: 侵入窃盗その他
      - name: non_burglary_total
        description: 非侵入窃盗計
      - name: non_burglary_car
        description: 非侵入窃盗自動車盗
      - name: non_burglary_motorcycle
        description: 非侵入窃盗オートバイ盗
      - name: non_burglary_bicycle
        description: 非侵入窃盗自転車盗
      - name: non_burglary_from_car
        description: 非侵入窃盗車上ねらい
      - name: non_burglary_vending_machine
        description: 非侵入窃盗自販機ねらい
      - name: non_burglary_construction_site
        description: 非侵入窃盗工事場ねらい
      - name: non_burglary_pickpocket
        description: 非侵入窃盗すり
      - name: non_burglary_snatching
        description: 非侵入窃盗ひったくり
      - name: non_burglary_unattended
        description: 非侵入窃盗置引き
      - name: non_burglary_shoplifting
        description: 非侵入窃盗万引き
      - name: non_burglary_other
        description: 非侵入窃盗その他
      - name: other_total
        description: その他計
      - name: other_fraud
        description: その他詐欺
      - name: other_embezzlement_lost_property
        description: その他占有離脱物横領
      - name: other_intellectual
        description: その他その他知能犯
      - name: other_gambling
        description: その他賭博
      - name: other_penal_code
        description: その他その他刑法犯
