schema: crime
name: raw_fraud_stats
description: |-
  警察庁「特殊詐欺の認知・検挙状況等について」の手口別・月別表の生データ。
  年別の確定値（2020〜2025年・令和2年の区分）と最新の暫定値（当年と前年・令和8年の区分）を
  区分×年×月×手口で1行にしたもの。形態（文言）別の内訳表と関連法令の表は含まない。
published: false
fields:
  - name: classification_year
    description: 手口の区分の適用開始年（2020 または 2026）
  - name: year
    description: 対象年（西暦）
  - name: month
    description: 対象月（1〜12）
  - name: modus
    description: 手口。「特殊詐欺」は全手口の合計
  - name: is_provisional
    description: 暫定値か
  - name: recognized_cases
    description: 認知件数
  - name: completed_cases
    description: 認知件数のうち既遂
  - name: damage_amount_yen
    description: 実質的な被害総額（円）
  - name: completed_damage_amount_yen
    description: 被害総額（既遂のみ・円）
  - name: cleared_cases
    description: 検挙件数
  - name: arrested_persons
    description: 検挙人員
