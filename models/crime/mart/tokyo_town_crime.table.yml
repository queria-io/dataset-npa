schema: crime
name: tokyo_town_crime
title: 東京都の町丁字別・罪種別・手口別の認知件数
description: |-
  警視庁「区市町村の町丁別、罪種別及び手口別認知件数」の年累計。東京都内で認知した刑法犯の件数を、
  町丁字ごとに罪種（凶悪犯・粗暴犯・侵入窃盗・非侵入窃盗・その他）と手口の37区分で持つ。
  1年×1町丁字で1行。2009年から2025年まで、1年あたり約5,000〜5,200町丁字。
  認知が0件の町丁字は行が無い。行が無い町丁字は0件として扱う。
  発生地が都外（他県）・海外・不明の認知は町丁字に属さないので収録しない。そのため町丁字を合計しても
  警視庁の公表する都全体の認知件数とは一致しない（差は年に数百件）。
  town が「以下不詳」の行は区市町村までしか分からない認知。town が NULL の行は原表で区市町村名だけが
  書かれた行で、檜原村・神津島村・利島村・青ヶ島村・御蔵島村の5村にだけある。
  町丁字は原表の文字列から全角空白を除いたもので、丁目の数字は全角。町丁字の新設・廃止で年ごとに顔ぶれが変わる。
  総合計は罪種の計の合計、罪種の計はその手口の合計と一致する（取得時に全行で確認済み）。
  当年の月累計（年途中の値）は収録しない。
  https://www.keishicho.metro.tokyo.lg.jp/about_mpd/jokyo_tokei/jokyo/ninchikensu.html
keywords:
  - 警視庁
  - 東京都
  - 犯罪
  - 認知件数
  - 町丁目
  - 町丁字
  - 罪種
  - 手口
  - 侵入窃盗
  - 自転車盗
  - 万引き
  - 治安
published: true
