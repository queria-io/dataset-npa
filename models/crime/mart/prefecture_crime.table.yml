schema: crime
name: prefecture_crime
title: 犯罪統計（都道府県別・罪種別）
description: '警察庁 犯罪統計資料（1～12月分の確定値）の都道府県別・罪種別の認知件数・検挙件数・検挙人員。

  1年×1罪種×1都道府県で1行。2020年から2025年まで。全都道府県を警察庁の同じ定義で集計した値で、

  crime.theft（13府県・町丁目単位）の件数を全国の中で位置づける基準に使える。

  罪種は互いに包含関係がある（侵入強盗は強盗の内数、侵入盗は重要窃盗犯と窃盗犯の内数、

  窃盗犯は刑法犯の内数など）。罪種をまたいで合計しない。

  2023年の刑法改正で強制性交等・強制わいせつは不同意性交等・不同意わいせつに置き換わり、

  構成要件も変わったため、公表どおり別の罪種名で持つ。

  検挙件数には前年以前に認知した事件の検挙を含むので、検挙件数÷認知件数（検挙率）は100%を超えることがある。

  月次の暫定値は収録しない。

  出典: 警察庁 犯罪統計資料（政府統計の総合窓口 e-Stat 掲載）。

  https://www.npa.go.jp/publications/statistics/sousa/statistics.html'
