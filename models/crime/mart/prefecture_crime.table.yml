schema: crime
name: prefecture_crime
title: 犯罪統計（都道府県別・罪種別）
description: |-
  都道府県別・罪種別の認知件数・検挙件数・検挙人員を、1 年×1 罪種×1 都道府県で 1 行に持つテーブルです。警察庁の犯罪統計資料の確定値で、2020 年から 2025 年までです。

  - 罪種には包含関係があるので（侵入盗は窃盗犯の内数など）、罪種をまたいで合計しないでください
  - 2023 年の刑法改正で、強制性交等・強制わいせつは不同意性交等・不同意わいせつという別の罪種名になります
  - 検挙件数は前年以前に認知した事件を含むので、検挙率は 100% を超えることがあります
keywords:
  - 警察庁
  - 犯罪統計
  - 認知件数
  - 検挙件数
  - 検挙率
  - 刑法犯
  - 都道府県
  - 治安
published: true
licenses:
  - JP-GOV-STD-2.0
sources:
  - path: https://www.npa.go.jp/publications/statistics/sousa/statistics.html
fields:
  - name: year
    title: 対象年
    description: 西暦。1～12月の確定値
  - name: crime_type
    title: 罪種
    description: '刑法犯総数／窃盗犯総数／重要犯罪総数／殺人／強盗／侵入強盗／放火／強制性交等（2022年まで）／

      不同意性交等（2023年から）／略取誘拐・人身売買／強制わいせつ（2022年まで）／不同意わいせつ（2023年から）／

      重要窃盗犯総数／侵入盗／侵入盗（住宅対象）／侵入盗（その他）／自動車盗／ひったくり／すり／

      主な街頭犯罪総数／器物損壊／住居侵入。主な街頭犯罪総数は路上強盗・部品ねらい・車上ねらい・

      自動販売機ねらい・オートバイ盗・自転車盗の合計'
  - name: prefecture_code
    title: 都道府県コード
    description: JIS X 0401 の2桁（01〜47）
    semantic: { role: entity, name: prefecture }
  - name: prefecture
    title: 都道府県
    description: 北海道は方面別の内訳を畳んだ道全体の値
  - name: recognized_cases
    title: 認知件数
    description: 警察が発生を認知した事件の数
  - name: cleared_cases
    title: 検挙件数
    description: 当年に検挙した事件の数。前年以前に認知した事件を含む
  - name: arrested_persons
    title: 検挙人員
    description: 当年に検挙した被疑者の数
