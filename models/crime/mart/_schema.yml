version: 2

models:
  - name: theft
    description: |
      都道府県警察が公開する犯罪発生情報。窃盗のうち街頭犯罪7手口
      （ひったくり・車上ねらい・部品ねらい・自動販売機ねらい・自動車盗・
      オートバイ盗・自転車盗）を1認知件1レコード・町丁目単位で収録する。
      現在は令和6年（2024年）分・9府県（栃木・千葉・神奈川・愛知・京都・大阪・
      佐賀・宮崎・鹿児島）。いずれも商用利用・再配布可の利用規約
      （CC BY / 政府標準利用規約 準拠 / 公共データ利用規約 PDL1.0）を確認済み。
      列は警察庁標準様式（手口別の可変列）の和集合で、手口に存在しない列は NULL。
      発見起点: 警察庁 犯罪オープンデータ リンク集。
      https://www.npa.go.jp/toukei/seianki/hanzaiopendatalink.html
    access: public
    config:
      meta:
        title: "犯罪発生情報（街頭犯罪）"
        published: true
        source_url: "https://www.npa.go.jp/toukei/seianki/hanzaiopendatalink.html"
        tags: ["都道府県警察", "犯罪", "防犯", "治安", "町丁目"]
    columns:
      - name: crime_name
        meta:
          title: 罪名
          description: 窃盗（一部に常習累犯窃盗）
      - name: modus
        meta:
          title: 手口
          description: ひったくり／車上ねらい／部品ねらい／自動販売機ねらい／自動車盗／オートバイ盗／自転車盗
      - name: prefecture
        meta:
          title: 都道府県（発生地）
          description: 発生地不明の場合は NULL
      - name: city_code
        meta:
          title: 市区町村コード（発生地）
          description: JIS 市区町村コード6桁（チェックデジット付き）。政令指定都市は区コード
      - name: city
        meta:
          title: 市区町村（発生地）
      - name: town
        meta:
          title: 町丁目（発生地）
      - name: occurred_date
        meta:
          title: 発生年月日（始期）
          description: |
            発生日が「不明」のレコードは NULL。データは認知年（data_year）単位の公開のため、
            発生始期は認知年より過去に遡ることがある
      - name: occurred_hour
        meta:
          title: 発生時（始期）
          description: 0〜23時。「不明」は NULL
      - name: location
        meta:
          title: 発生場所
          description: 道路上・駐車（輪）場・一戸建住宅・4階建て以上共同住宅など
      - name: location_detail
        meta:
          title: 発生場所の詳細
          description: ひったくりには存在しない（NULL）
      - name: police_station
        meta:
          title: 管轄警察署（発生地）
      - name: police_box
        meta:
          title: 管轄交番・駐在所（発生地）
      - name: victim_gender
        meta:
          title: 被害者の性別
          description: ひったくりのみ（他手口は NULL）
      - name: victim_age
        meta:
          title: 被害者の年齢
          description: 10歳代・20歳代…70歳以上等の年代区分。ひったくり・自転車盗のみ
      - name: victim_occupation
        meta:
          title: 被害者の職業
          description: 自転車盗のみ（他手口は NULL）
      - name: cash_damage
        meta:
          title: 現金被害の有無
          description: ひったくり・車上ねらい・自動販売機ねらいのみ
      - name: lock_status
        meta:
          title: 施錠関係
          description: 車上ねらい・自動車盗・オートバイ盗・自転車盗のみ
      - name: anti_theft_device
        meta:
          title: 盗難防止装置の有無
          description: 自動車盗・オートバイ盗のみ
      - name: stolen_property
        meta:
          title: 現金以外の主な被害品
          description: 部品ねらい・自動車盗・オートバイ盗のみ
      - name: source_prefecture
        meta:
          title: 公表元県警の都道府県
          description: データを公表した都道府県警察。発生地の都道府県とは別に常に値を持つ
      - name: data_year
        meta:
          title: データ対象年
          description: 公開データの対象年（西暦）。現在は2024年のみ
