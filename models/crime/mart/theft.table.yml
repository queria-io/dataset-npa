schema: crime
name: theft
title: 犯罪発生情報（街頭犯罪）
description: |-
  街頭犯罪 7 手口（ひったくり・車上ねらい・部品ねらい・自動販売機ねらい・自動車盗・オートバイ盗・自転車盗）の発生情報を 1 認知件 1 行・町丁目単位で持つテーブルです。

  - 収録は 12 府県の 2024 年認知分だけで、全国の件数や府県間の比較には使えません
  - 列は手口ごとの様式の和集合で、その手口に無い列は NULL です
  - 発生日は認知年より前に遡ることがあります
keywords:
  - 都道府県警察
  - 犯罪
  - 防犯
  - 治安
  - 町丁目
licenses:
  - CC-BY-2.1-JP
  - CC-BY-4.0
  - JP-GOV-STD-2.0
  - JP-PDL-1.0
sources:
  - path: https://www.npa.go.jp/toukei/seianki/hanzaiopendatalink.html
fields:
  - name: crime_name
    title: 罪名
    description: 窃盗（一部に常習累犯窃盗）
  - name: modus
    title: 手口
    description: ひったくり／車上ねらい／部品ねらい／自動販売機ねらい／自動車盗／オートバイ盗／自転車盗
  - name: prefecture
    title: 都道府県（発生地）
    description: 発生地不明の場合は NULL（空欄・「日本国内のいずれかの場所」等の文言を NULL に寄せている）
  - name: city_code
    title: 市区町村コード（発生地）
    description: JIS 市区町村コード6桁（チェックデジット付き）。政令指定都市は区コード
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: city
    title: 市区町村（発生地）
  - name: town
    title: 町丁目（発生地）
    annotations: { queria: { semantic: { role: entity, name: small_area } } }
  - name: occurred_date
    title: 発生年月日（始期）
    description: '発生日が「不明」のレコードは NULL。データは認知年（data_year）単位の公開のため、

      発生始期は認知年より過去に遡ることがある'
  - name: occurred_hour
    title: 発生時（始期）
    description: 0〜23時。「不明」は NULL
  - name: location
    title: 発生場所
    description: 道路上・駐車（輪）場・一戸建住宅・4階建て以上共同住宅など
  - name: location_detail
    title: 発生場所の詳細
    description: ひったくりには存在しない（NULL）
  - name: police_station
    title: 管轄警察署（発生地）
  - name: police_box
    title: 管轄交番・駐在所（発生地）
  - name: victim_gender
    title: 被害者の性別
    description: ひったくりのみ（他手口は NULL）
  - name: victim_age
    title: 被害者の年齢
    description: 10歳代・20歳代…70歳以上等の年代区分。ひったくり・自転車盗のみ
  - name: victim_occupation
    title: 被害者の職業
    description: 自転車盗のみ（他手口は NULL）
  - name: cash_damage
    title: 現金被害の有無
    description: ひったくり・車上ねらい・自動販売機ねらいのみ
  - name: lock_status
    title: 施錠関係
    description: 車上ねらい・自動車盗・オートバイ盗・自転車盗のみ
  - name: anti_theft_device
    title: 盗難防止装置の有無
    description: 自動車盗・オートバイ盗のみ
  - name: stolen_property
    title: 現金以外の主な被害品
    description: 部品ねらい・自動車盗・オートバイ盗のみ
  - name: source_prefecture
    title: 公表元県警の都道府県
    description: データを公表した都道府県警察。発生地の都道府県とは別に常に値を持つ
  - name: data_year
    title: データ対象年
    description: 公開データの対象年（西暦）。現在は2024年のみ
