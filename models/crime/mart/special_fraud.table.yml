schema: crime
name: special_fraud
title: 特殊詐欺の認知・検挙状況（手口別・月別）
description: |-
  警察庁「特殊詐欺の認知・検挙状況等について」の全国の手口別・月別の認知件数・被害額・検挙件数・検挙人員。
  1区分×1か月×1手口で1行。2020年1月から最新の公表月まで。都道府県別の値は無い。
  手口の区分は2通りある。classification_year が 2020 の行は令和2年の10類型（2020〜2025年の確定値）、
  2026 の行は令和8年の区分で、ニセ警察詐欺が独立し、SNS型投資詐欺・SNS型ロマンス詐欺が手口に加わる。
  2025年は両方の区分で収録されていて、令和8年の区分の方が特殊詐欺全体の件数も被害額も大きい。
  区分をまたいで系列を連結したり、合計したりしない。
  modus が「特殊詐欺」の行は全手口の合計なので、手口の行と足し合わせない。
  当年の値は暫定値（is_provisional）で、確定値で変わることがある。
  被害額は円単位。実質的な被害総額は ATM から引き出された額を加えた額で、還付金詐欺だけは
  被害総額（既遂のみ）しか公表されていない（実質的な被害総額の特殊詐欺全体には含まれる）。
  検挙件数には前月以前に認知した事件の検挙を含む。
  https://www.npa.go.jp/publications/statistics/sousa/sagi.html
keywords:
  - 警察庁
  - 特殊詐欺
  - 振り込め詐欺
  - オレオレ詐欺
  - ニセ警察詐欺
  - SNS型投資詐欺
  - ロマンス詐欺
  - 被害額
  - 認知件数
  - 検挙件数
published: true
licenses:
  - JP-PDL-1.0
sources:
  - path: https://www.npa.go.jp/publications/statistics/sousa/sagi.html
fields:
  - name: classification_year
    title: 手口の区分
    description: 区分の適用開始年。2020 は令和2年の10類型、2026 は令和8年の区分
  - name: year
    title: 対象年
    description: 西暦
  - name: month
    title: 対象月
    description: 1〜12
  - name: month_start
    title: 対象月の初日
    description: 月次の系列を描くための日付
  - name: modus
    title: 手口
    description: |-
      特殊詐欺（全手口の合計）／オレオレ詐欺／預貯金詐欺／架空料金請求詐欺／還付金詐欺／融資保証金詐欺／
      金融商品詐欺／ギャンブル詐欺／交際あっせん詐欺／キャッシュカード詐欺盗／その他の特殊詐欺。
      令和8年の区分ではこれに ニセ警察詐欺／SNS型投資詐欺／SNS型ロマンス詐欺 が加わる
  - name: is_provisional
    title: 暫定値
    description: 当年の公表月までの暫定値なら true
  - name: recognized_cases
    title: 認知件数
    description: 警察が発生を認知した事件の数
  - name: completed_cases
    title: 既遂件数
    description: 認知件数のうち既遂
  - name: damage_amount_yen
    title: 実質的な被害総額（円）
    description: 詐取・窃取されたキャッシュカード等で ATM から引き出された額を加えた額。還付金詐欺は NULL
  - name: completed_damage_amount_yen
    title: 被害総額（既遂のみ・円）
    description: 還付金詐欺は両区分、その他の手口は令和2年の区分でだけ値がある。特殊詐欺全体とキャッシュカード詐欺盗は NULL
  - name: cleared_cases
    title: 検挙件数
    description: 当月に検挙した事件の数。ニセ警察詐欺の2025年は統計が無く NULL
  - name: arrested_persons
    title: 検挙人員
    description: 当月に検挙した被疑者の数。ニセ警察詐欺の2025年は統計が無く NULL
