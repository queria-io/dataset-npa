schema: main
name: traffic_accident
title: 交通事故（発生地点）
description: |-
  死傷者を伴う交通事故の発生地点を 1 件 1 行で持つテーブルです。2024 年発生分で、発生日時・緯度経度・天候・道路形状・事故類型などを持ちます。

  - 物損事故は含みません。死者は発生から 24 時間以内の死者です
  - 市区町村で他のテーブルと結合するときは lg_code を使います。prefecture_code は警察独自のコード（北海道は方面別に 5 分割）です
keywords:
  - 警察庁
  - 交通事故
  - 交通安全
  - GIS
  - 緯度経度
sources:
  - path: https://www.npa.go.jp/publications/statistics/koutsuu/opendata/index_opendata.html
fields:
  - name: accident_id
    title: 事故識別子
    description: 発生年・都道府県・警察署等・本票番号を連結した一意キー
  - name: prefecture_code
    title: 都道府県コード
    description: 警察の管轄区分（北海道は方面別に5分割）。JIS の都道府県コードとは異なります
  - name: prefecture
    title: 都道府県
  - name: police_station_code
    title: 警察署等コード
  - name: accident_number
    title: 本票番号
  - name: accident_type_code
    title: 事故内容コード
  - name: accident_type
    title: 事故内容
    description: 死亡（発生から24時間以内の死者）または負傷
  - name: fatalities
    title: 死者数
  - name: injuries
    title: 負傷者数
  - name: city_code
    title: 市区町村コード
    description: 標準地域コードの市区町村の部分（3 桁）。都道府県の部分を含みません
  - name: lg_code
    title: 全国地方公共団体コード
    description: 6 桁（検査数字付き）。発生地の市区町村で、政令指定都市は区。発生年の時点のコード
    annotations: { queria: { semantic: { role: entity, name: city } } }
  - name: occurred_date
    title: 発生日
  - name: occurred_at
    title: 発生日時
    description: 時分が不明の場合は NULL
  - name: occurred_year
    title: 発生年
  - name: occurred_month
    title: 発生月
  - name: occurred_day
    title: 発生日（日）
  - name: occurred_hour
    title: 発生時
  - name: occurred_minute
    title: 発生分
  - name: day_of_week_code
    title: 曜日コード
  - name: day_of_week
    title: 曜日
  - name: holiday_code
    title: 祝日コード
  - name: holiday
    title: 祝日
    description: 当日／前日／その他
  - name: day_night_code
    title: 昼夜コード
  - name: day_night
    title: 昼夜
    description: 日の出・日の入り前後1時間の明暮を区別
  - name: weather_code
    title: 天候コード
  - name: weather
    title: 天候
  - name: terrain_code
    title: 地形コード
  - name: terrain
    title: 地形
    description: 市街地（人口集中／その他）・非市街地の別
  - name: road_surface_code
    title: 路面状態コード
  - name: road_surface
    title: 路面状態
  - name: road_shape_code
    title: 道路形状コード
  - name: road_shape
    title: 道路形状
    description: 交差点・単路・踏切などの別
  - name: traffic_signal_code
    title: 信号機コード
  - name: traffic_signal
    title: 信号機
    description: 当事者が対面する信号機の作動状況
  - name: accident_pattern_code
    title: 事故類型コード
  - name: accident_pattern
    title: 事故類型
    description: 人対車両・車両相互・車両単独・列車の別
  - name: latitude
    title: 緯度（北緯・十進度）
  - name: longitude
    title: 経度（東経・十進度）
  - name: geometry
    title: 位置（ポイント）
    description: 緯度経度から生成した地点ポイント（EPSG:6668 相当）
