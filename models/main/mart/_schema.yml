version: 2

models:
  - name: traffic_accident
    description: |
      交通事故の発生地点（ポイント）。死傷者を伴う交通事故を1件1レコードで収録し、
      発生日時・地点（緯度経度・geometry）・事故内容・天候・路面状態・道路形状・
      事故類型などを持つ。警察庁 交通事故統計情報オープンデータ（本票）。
      都道府県コードは警察の管轄区分（北海道は方面別に5分割）で、JIS コードとは異なる。
      出典: 警察庁 交通事故統計情報のオープンデータ。
      https://www.npa.go.jp/publications/statistics/koutsuu/opendata/index_opendata.html
      各種コードは警察庁「各種コード表」に準拠する。
    access: public
    config:
      meta:
        title: "交通事故（発生地点）"
        published: true
        source_url: "https://www.npa.go.jp/publications/statistics/koutsuu/opendata/index_opendata.html"
        tags: ["警察庁", "交通事故", "交通安全", "GIS", "緯度経度"]
    columns:
      - name: accident_id
        meta:
          title: 事故識別子
          description: 発生年・都道府県・警察署等・本票番号を連結した一意キー
      - name: prefecture_code
        meta:
          title: 都道府県コード
          description: 警察の管轄区分（北海道は方面別に5分割）
      - name: prefecture
        meta:
          title: 都道府県
      - name: police_station_code
        meta:
          title: 警察署等コード
      - name: accident_number
        meta:
          title: 本票番号
      - name: accident_type_code
        meta:
          title: 事故内容コード
      - name: accident_type
        meta:
          title: 事故内容
          description: 死亡（発生から24時間以内の死者）または負傷
      - name: fatalities
        meta:
          title: 死者数
      - name: injuries
        meta:
          title: 負傷者数
      - name: city_code
        meta:
          title: 市区町村コード
          description: 警察独自の3桁コード（JIS 市区町村コードとは異なる）
      - name: occurred_date
        meta:
          title: 発生日
      - name: occurred_at
        meta:
          title: 発生日時
          description: 時分が不明の場合は NULL
      - name: occurred_year
        meta:
          title: 発生年
      - name: occurred_month
        meta:
          title: 発生月
      - name: occurred_day
        meta:
          title: 発生日（日）
      - name: occurred_hour
        meta:
          title: 発生時
      - name: occurred_minute
        meta:
          title: 発生分
      - name: day_of_week_code
        meta:
          title: 曜日コード
      - name: day_of_week
        meta:
          title: 曜日
      - name: holiday_code
        meta:
          title: 祝日コード
      - name: holiday
        meta:
          title: 祝日
          description: 当日／前日／その他
      - name: day_night_code
        meta:
          title: 昼夜コード
      - name: day_night
        meta:
          title: 昼夜
          description: 日の出・日の入り前後1時間の明暮を区別
      - name: weather_code
        meta:
          title: 天候コード
      - name: weather
        meta:
          title: 天候
      - name: terrain_code
        meta:
          title: 地形コード
      - name: terrain
        meta:
          title: 地形
          description: 市街地（人口集中／その他）・非市街地の別
      - name: road_surface_code
        meta:
          title: 路面状態コード
      - name: road_surface
        meta:
          title: 路面状態
      - name: road_shape_code
        meta:
          title: 道路形状コード
      - name: road_shape
        meta:
          title: 道路形状
          description: 交差点・単路・踏切などの別
      - name: traffic_signal_code
        meta:
          title: 信号機コード
      - name: traffic_signal
        meta:
          title: 信号機
          description: 当事者が対面する信号機の作動状況
      - name: accident_pattern_code
        meta:
          title: 事故類型コード
      - name: accident_pattern
        meta:
          title: 事故類型
          description: 人対車両・車両相互・車両単独・列車の別
      - name: latitude
        meta:
          title: 緯度（北緯・十進度）
      - name: longitude
        meta:
          title: 経度（東経・十進度）
      - name: geometry
        meta:
          title: 位置（ポイント）
          description: 緯度経度から生成した地点ポイント（EPSG:6668 相当）
