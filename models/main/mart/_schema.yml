version: 2

models:
  - name: traffic_accident
    access: public
    columns:
      - name: accident_id
      - name: prefecture_code
        data_tests:
          - relationships:
              arguments:
                to: ref('prefecture')
                field: police_prefecture_code
      - name: prefecture
      - name: police_station_code
      - name: accident_number
      - name: accident_type_code
      - name: accident_type
      - name: fatalities
      - name: injuries
      - name: city_code
      - name: lg_code
        data_tests:
          - not_null
      - name: occurred_date
      - name: occurred_at
      - name: occurred_year
      - name: occurred_month
      - name: occurred_day
      - name: occurred_hour
      - name: occurred_minute
      - name: day_of_week_code
      - name: day_of_week
      - name: holiday_code
      - name: holiday
      - name: day_night_code
      - name: day_night
      - name: weather_code
      - name: weather
      - name: terrain_code
      - name: terrain
      - name: road_surface_code
      - name: road_surface
      - name: road_shape_code
      - name: road_shape
      - name: traffic_signal_code
      - name: traffic_signal
      - name: accident_pattern_code
      - name: accident_pattern
      - name: latitude
      - name: longitude
      - name: geometry
